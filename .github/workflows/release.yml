name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-wails3-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - run: go install github.com/tc-hib/go-winres@latest
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Prepare FFmpeg for embedding
        shell: pwsh
        run: |
          cp thirdparty/windows-amd64/ffmpeg.exe internal/ffmpeg/bin/
          cp thirdparty/windows-amd64/ffprobe.exe internal/ffmpeg/bin/
      - run: task package:windows VERSION=${{ github.event.inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: Extral-windows-amd64
          path: build/bin/Extral-windows-amd64.exe

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-wails3-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - run: task package:darwin VERSION=${{ github.event.inputs.version || github.ref_name }}
      - name: Create macOS .dmg
        run: |
          mkdir -p /tmp/dmg-content
          cp -R build/bin/Extral.app /tmp/dmg-content/
          ln -s /Applications /tmp/dmg-content/Applications
          hdiutil create -volname "Extral" -srcfolder /tmp/dmg-content -ov -format UDZO build/bin/Extral-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Extral-macos
          path: build/bin/Extral-macos.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          {
            echo "## ✨ 新功能"
            echo ""
            git log "$RANGE" --format="- %s" --grep="feat" -i 2>/dev/null || true
            echo ""
            echo "## 🐛 修复"
            echo ""
            git log "$RANGE" --format="- %s" --grep="fix" -i 2>/dev/null || true
            echo ""
            echo "## 📦 下载"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|------|------|"
            echo "| macOS | \`Extral-macos.dmg\` |"
            echo "| Windows | \`Extral-windows-amd64.exe\` |"
            echo ""
            echo "## 💻 macOS 使用说明"
            echo ""
            echo "双击打开 .dmg 文件，将 Extral 拖入 Applications 文件夹即可。"
            echo "如果提示"无法打开"或"已损坏"，请在终端执行："
            echo ""
            echo "\`\`\`bash"
            echo "xattr -cr /path/to/Extral.app"
            echo "\`\`\`"
            echo ""
            echo "然后即可正常双击打开。"
          } > /tmp/release-notes.md

          {
            echo "body<<RELEASEEOF"
            cat /tmp/release-notes.md
            echo "RELEASEEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/Extral-windows-amd64/*.exe
            artifacts/Extral-macos/*.dmg
