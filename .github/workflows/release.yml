name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-wails3-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - run: go install github.com/tc-hib/go-winres@latest
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          mkdir -p thirdparty/windows-amd64
          curl -sL "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -o ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp
          cp ffmpeg-temp/ffmpeg-*-essentials_build/bin/ffmpeg.exe thirdparty/windows-amd64/
          cp ffmpeg-temp/ffmpeg-*-essentials_build/bin/ffprobe.exe thirdparty/windows-amd64/
          rm -rf ffmpeg.zip ffmpeg-temp
      - run: task package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Extral-windows-amd64
          path: build/bin/windows-dist/

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-wails3-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Download FFmpeg for macOS
        run: |
          mkdir -p thirdparty/darwin-arm64
          curl -sL "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/arm64/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip -d thirdparty/darwin-arm64
          mv thirdparty/darwin-arm64/ffmpeg thirdparty/darwin-arm64/ffmpeg_tmp 2>/dev/null || true
          curl -sL "https://evermeet.cx/ffmpeg/getrelease/ffprobe/arm64/zip" -o ffprobe.zip
          unzip -o ffprobe.zip -d thirdparty/darwin-arm64
          mv thirdparty/darwin-arm64/ffmpeg_tmp thirdparty/darwin-arm64/ffmpeg 2>/dev/null || true
          chmod +x thirdparty/darwin-arm64/ffmpeg thirdparty/darwin-arm64/ffprobe
          rm -f ffmpeg.zip ffprobe.zip
      - run: task package:darwin
      - name: Create macOS .dmg
        run: |
          mkdir -p /tmp/dmg-content
          cp -R build/bin/Extral.app /tmp/dmg-content/
          ln -s /Applications /tmp/dmg-content/Applications
          hdiutil create -volname "Extral" -srcfolder /tmp/dmg-content -ov -format UDZO build/bin/Extral-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Extral-macos
          path: build/bin/Extral-macos.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          NL=$(printf '\n')
          BL=$(printf '\n\n')

          NOTES="## ✨ 新功能${BL}"
          FEATS=$(git log "$RANGE" --format="- %s" --grep="^feat" -i || true)
          if [ -n "$FEATS" ]; then
            NOTES="${NOTES}${FEATS}${BL}"
          fi

          NOTES="${NOTES}## 🐛 修复${BL}"
          FIXES=$(git log "$RANGE" --format="- %s" --grep="^fix" -i || true)
          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}${FIXES}${BL}"
          fi

          NOTES="${NOTES}## 📦 下载${BL}"
          NOTES="${NOTES}| 平台 | 文件 |${NL}"
          NOTES="${NOTES}|------|------|${NL}"
          NOTES="${NOTES}| macOS | \`Extral-macos.dmg\` |${NL}"
          NOTES="${NOTES}| Windows | \`Extral-windows-amd64.exe\` |${BL}"
          NOTES="${NOTES}## 💻 macOS 使用说明${BL}"
          NOTES="${NOTES}双击打开 .dmg 文件，将 Extral 拖入 Applications 文件夹即可。${NL}"
          NOTES="${NOTES}如果提示"无法打开"或"已损坏"，请在终端执行：${BL}"
          NOTES="${NOTES}\`\`\`bash${NL}"
          NOTES="${NOTES}xattr -cr /path/to/Extral.app${NL}"
          NOTES="${NOTES}\`\`\`${BL}"
          NOTES="${NOTES}然后即可正常双击打开。${NL}"

          {
            echo "body<<RELEASEEOF"
            echo "$NOTES"
            echo "RELEASEEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/Extral-windows-amd64/**/*
            artifacts/Extral-macos/*.dmg
