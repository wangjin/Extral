name: Build FFmpeg

on:
  workflow_dispatch:

env:
  FFMPEG_VERSION: "n8.1.1"

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Install libx264
        run: brew install x264

      - name: Build FFmpeg
        run: |
          git clone --branch ${{ env.FFMPEG_VERSION }} --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src

          ./configure \
            --disable-everything \
            --enable-decoder=h264,hevc,mjpeg,mpeg4,vp8,vp9,rawvideo \
            --enable-demuxer=mov,matroska,avi,flv,mpjpeg \
            --enable-parser=h264,hevc,mjpeg,mpeg4video,vp8,vp9 \
            --enable-protocol=file,pipe \
            --enable-muxer=image2,mp4,matroska,image2pipe \
            --enable-encoder=png,mjpeg,libx264,aac \
            --enable-filter=scale,select,fps,crop \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-avfoundation \
            --enable-indev=avfoundation \
            --enable-libx264 \
            --enable-gpl \
            --disable-doc \
            --disable-network \
            --disable-autodetect

          make -j$(sysctl -n hw.ncpu)
          strip ffmpeg ffprobe

          echo "=== Binary sizes ==="
          ls -lh ffmpeg ffprobe

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-arm64
          path: |
            ffmpeg-src/ffmpeg
            ffmpeg-src/ffprobe

  build-windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-x264
            make
            git
            diffutils

      - name: Debug x264
        run: |
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"
          echo "=== pkg-config x264 info ==="
          pkg-config --exists x264 || (echo "x264 not found by pkg-config" && exit 1)
          pkg-config --modversion x264
          echo "--- cflags + libs (static) ---"
          pkg-config --cflags --libs --static x264
          echo "--- lib files ---"
          ls -la /mingw64/lib/libx264* || true
          echo "--- include files ---"
          ls -la /mingw64/include/x264* || true
          echo "--- pkg-config file ---"
          cat /mingw64/lib/pkgconfig/x264.pc || true
          echo "--- try compile test ---"
          cat > /tmp/test_x264.c << 'EOF'
          #include <x264.h>
          int main(void) { x264_encoder_open(0); return 0; }
          EOF
          gcc -o /tmp/test_x264.exe /tmp/test_x264.c $(pkg-config --cflags --libs --static x264) -static 2>&1 || echo "STATIC FAIL, trying dynamic..."
          gcc -o /tmp/test_x264.exe /tmp/test_x264.c $(pkg-config --cflags --libs --static x264) 2>&1 || echo "DYNAMIC FAIL too"

      - name: Build FFmpeg
        run: |
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig"

          git clone --branch ${{ env.FFMPEG_VERSION }} --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src

          ./configure \
            --disable-everything \
            --enable-decoder=h264,hevc,mjpeg,mpeg4,vp8,vp9,rawvideo \
            --enable-demuxer=mov,matroska,avi,flv,mpjpeg \
            --enable-parser=h264,hevc,mjpeg,mpeg4video,vp8,vp9 \
            --enable-protocol=file,pipe \
            --enable-muxer=image2,mp4,matroska,image2pipe \
            --enable-encoder=png,mjpeg,libx264,aac \
            --enable-filter=scale,select,fps,crop \
            --enable-ffmpeg \
            --enable-ffprobe \
            --enable-indev=dshow \
            --enable-libx264 \
            --enable-gpl \
            --disable-doc \
            --disable-network \
            --disable-x86asm \
            --extra-ldflags="-static" \
            --extra-cflags="-I/mingw64/include" \
            --extra-libs="-lpthread" \
            --pkg-config-flags="--static" \
          || (echo "=== Configure failed, last 100 lines of config.log ===" && tail -100 ffbuild/config.log && exit 1)

          make -j$(nproc)
          strip ffmpeg.exe ffprobe.exe

          echo "=== Binary sizes ==="
          ls -lh ffmpeg.exe ffprobe.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-amd64
          path: |
            ffmpeg-src/ffmpeg.exe
            ffmpeg-src/ffprobe.exe

  report:
    needs: [build-macos-arm64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Show binary sizes
        run: |
          echo "## FFmpeg Binary Sizes"
          echo ""
          find artifacts -type f \( -name 'ffmpeg' -o -name 'ffmpeg.exe' -o -name 'ffprobe' -o -name 'ffprobe.exe' \) -exec ls -lh {} \; | awk '{print $NF, $5}'
