version: "3"

vars:
  APP_NAME: Extral
  FRONTEND_DIR: frontend
  BUILD_DIR: build/bin
  BINDINGS_DIR: frontend/bindings
  VERSION:
    sh: git describe --tags --always 2>/dev/null || echo "dev"

env:
  CGO_ENABLED: 1

tasks:
  dev:
    desc: Run in development mode with hot reload
    cmds:
      - wails3 dev

  generate:
    desc: Generate TypeScript bindings from Go services
    cmds:
      - wails3 generate bindings -ts -d {{.BINDINGS_DIR}} .

  frontend:install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install

  frontend:build:
    desc: Build frontend assets
    deps: [frontend:install, generate]
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run build

  build:darwin:
    desc: Build macOS binary for current architecture
    deps: [frontend:build]
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.APP_NAME}} .

  build:darwin:arm64:
    desc: Build macOS arm64 binary (Apple Silicon)
    deps: [frontend:build]
    cmds:
      - GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.APP_NAME}}-darwin-arm64 .

  build:darwin:amd64:
    desc: Build macOS amd64 binary
    deps: [frontend:build]
    cmds:
      - GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.APP_NAME}}-darwin-amd64 .

  generate:windows:syso:
    desc: Generate Windows .syso resource file with icon
    cmds:
      - go-winres make --product-version={{.VERSION}} --file-version={{.VERSION}}
    sources:
      - winres/winres.json
      - assets/icon.png
    generates:
      - rsrc_windows_amd64.syso

  prepare:windows:ffmpeg:
    desc: Copy FFmpeg binaries for embedding into Windows build
    cmds:
      - mkdir -p internal/ffmpeg/bin
      - cp thirdparty/windows-amd64/ffmpeg.exe internal/ffmpeg/bin/ || true
      - cp thirdparty/windows-amd64/ffprobe.exe internal/ffmpeg/bin/ || true
    sources:
      - thirdparty/windows-amd64/ffmpeg.exe
    status:
      - test -f internal/ffmpeg/bin/ffmpeg.exe

  build:windows:amd64:
    desc: Build Windows amd64 binary
    deps: [frontend:build, generate:windows:syso, prepare:windows:ffmpeg]
    cmds:
      - GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -X main.version={{.VERSION}}" -o {{.BUILD_DIR}}/{{.APP_NAME}}-windows-amd64.exe .

  build:
    desc: Build binary for current platform
    cmds:
      - task: build:darwin

  generate:darwin:plist:
    desc: Generate macOS Info.plist
    cmds:
      - mkdir -p build/darwin
      - |
        cat > build/darwin/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>Extral</string>
          <key>CFBundleIdentifier</key>
          <string>com.extral.app</string>
          <key>CFBundleName</key>
          <string>Extral</string>
          <key>CFBundleDisplayName</key>
          <string>Extral</string>
          <key>CFBundleVersion</key>
          <string>{{.VERSION}}</string>
          <key>CFBundleShortVersionString</key>
          <string>{{.VERSION}}</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleIconFile</key>
          <string>Extral</string>
          <key>LSMinimumSystemVersion</key>
          <string>11.0</string>
          <key>NSHighResolutionCapable</key>
          <true/>
        </dict>
        </plist>
        EOF

  generate:darwin:icns:
    desc: Generate macOS .icns from assets/icon.png
    cmds:
      - mkdir -p build/darwin/Extral.iconset
      - |
        SRC="assets/icon.png"
        ICONSET="build/darwin/Extral.iconset"
        for size in 16 32 64 128 256 512; do
          sips -z $size $size "$SRC" --out "$ICONSET/icon_${size}x${size}.png" -s format png >/dev/null 2>&1
          sips -z $((size*2)) $((size*2)) "$SRC" --out "$ICONSET/icon_${size}x${size}@2x.png" -s format png >/dev/null 2>&1
        done
        iconutil -c icns "$ICONSET" -o build/darwin/Extral.icns
    sources:
      - assets/icon.png
    generates:
      - build/darwin/Extral.icns

  package:darwin:
    desc: Package macOS .app bundle
    deps: [build:darwin, generate:darwin:plist, generate:darwin:icns]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/{MacOS,Resources,Resources/ffmpeg}
      - cp {{.BUILD_DIR}}/{{.APP_NAME}} {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/MacOS
      - cp build/darwin/Info.plist {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents
      - cp build/darwin/Extral.icns {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/Resources/Extral.icns
      - cp thirdparty/darwin-arm64/ffmpeg {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/Resources/ffmpeg/ || true
      - cp thirdparty/darwin-arm64/ffprobe {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/Resources/ffmpeg/ || true
      - chmod +x {{.BUILD_DIR}}/{{.APP_NAME}}.app/Contents/Resources/ffmpeg/* || true
      - codesign --force --deep --sign - {{.BUILD_DIR}}/{{.APP_NAME}}.app || true

  package:darwin:dmg:
    desc: Package macOS .dmg installer
    deps: [package:darwin]
    cmds:
      - mkdir -p /tmp/{{.APP_NAME}}-dmg
      - cp -R {{.BUILD_DIR}}/{{.APP_NAME}}.app /tmp/{{.APP_NAME}}-dmg/
      - ln -sf /Applications /tmp/{{.APP_NAME}}-dmg/Applications
      - hdiutil create -volname "Extral" -srcfolder /tmp/{{.APP_NAME}}-dmg -ov -format UDZO {{.BUILD_DIR}}/{{.APP_NAME}}-macos.dmg

  package:windows:
    desc: Package Windows exe
    deps: [build:windows:amd64]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/windows-dist
      - cp {{.BUILD_DIR}}/{{.APP_NAME}}-windows-amd64.exe {{.BUILD_DIR}}/windows-dist/

  test:
    desc: Run Go tests
    cmds:
      - go test ./internal/... -v

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -rf build
      - rm -f *.syso
      - rm -rf {{.FRONTEND_DIR}}/dist
      - rm -rf {{.FRONTEND_DIR}}/node_modules
